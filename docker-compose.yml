version: '3'

services:
  app:
    image: node-app  
    ports:
      - "3000:3000" 
    depends_on:
      - mysql  
    networks:
      - mynetwork

  mysql:
    image: mysql:8 
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
